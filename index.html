<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RezFlix — Ultimate Streaming Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 950: '#030303', 900: '#08080a', 800: '#121217', accent: '#ffffff' }
                    },
                    boxShadow: {
                        'glow': '0 0 30px -5px rgba(255, 255, 255, 0.25)',
                        'card-glow': '0 10px 30px -10px rgba(0, 0, 0, 0.8)'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030303;
            color: #ffffff;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #22222a; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #444455; }
        .glass-header {
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glass-card {
            background: rgba(18, 18, 23, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">

    <!-- TOP NAMES BANNER -->
    <div class="bg-gradient-to-r from-zinc-900 via-zinc-800 to-zinc-900 border-b border-white/10 py-2 px-4 text-center">
        <p class="text-xs sm:text-sm font-bold tracking-wide text-zinc-200">
            zaman imran, esha imran, amaima imran, imran, shazia, ibrahim
        </p>
    </div>

    <!-- ACTIVE WATCH PARTY STATUS BAR -->
    <div id="partyStatusBar" class="hidden bg-emerald-950/80 border-b border-emerald-500/30 px-4 py-2 text-xs font-bold text-emerald-300 flex items-center justify-between backdrop-blur-md">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Watch Party Active: <span id="activeRoomCode" class="font-mono text-white"></span></span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="copyPartyLink()" class="hover:underline flex items-center gap-1 text-emerald-200">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Invite Link
            </button>
            <button onclick="leaveParty()" class="bg-red-900/60 border border-red-500/40 text-red-200 px-2 py-0.5 rounded-md hover:bg-red-800">Leave</button>
        </div>
    </div>

    <!-- TOP NAVIGATION BAR -->
    <header class="sticky top-0 z-50 w-full glass-header border-b border-white/10 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-4">
            
            <!-- Brand Logo & Primary Tabs -->
            <div class="flex items-center gap-8">
                <a href="#" onclick="switchTab('home')" class="flex items-center gap-2.5 group">
                    <div class="w-10 h-10 rounded-2xl bg-white text-black font-black flex items-center justify-center text-2xl shadow-glow group-hover:scale-105 transition-transform">R</div>
                    <span class="text-2xl font-black tracking-wider text-white">REZFLIX</span>
                </a>

                <nav class="hidden md:flex items-center gap-1.5 bg-zinc-900/80 p-1.5 rounded-2xl border border-white/10">
                    <button id="tab-home" onclick="switchTab('home')" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white text-black">Home</button>
                    <button id="tab-movies" onclick="switchTab('movies')" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-white hover:bg-white/10">Movies</button>
                    <button id="tab-tv" onclick="switchTab('tv')" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-white hover:bg-white/10">TV Shows</button>
                    <button id="tab-watchlist" onclick="switchTab('watchlist')" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-zinc-400 hover:text-white hover:bg-white/10 flex items-center gap-1.5">
                        <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> Watchlist
                    </button>
                </nav>
            </div>

            <!-- SEARCH ENGINE BAR -->
            <div class="relative flex-1 max-w-md hidden sm:block">
                <div class="relative flex items-center">
                    <i data-lucide="search" class="absolute left-4 w-4 h-4 text-zinc-400 pointer-events-none"></i>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search Movies or TV Shows..." 
                           class="w-full bg-zinc-900/90 border border-white/15 rounded-full pl-11 pr-20 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-white focus:ring-1 focus:ring-white/30 transition-all shadow-inner">
                    
                    <div class="absolute right-3 flex items-center gap-1">
                        <button type="button" id="searchClearBtn" onclick="clearSearch()" class="hidden text-zinc-400 hover:text-white p-1">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                        <span class="text-[10px] font-mono text-zinc-500 bg-zinc-800 px-2 py-0.5 rounded-md border border-white/5">ESC</span>
                    </div>
                </div>

                <!-- LIVE SEARCH OVERLAY -->
                <div id="searchResultsPanel" class="hidden absolute top-full left-0 right-0 mt-3 bg-zinc-950 border border-white/20 rounded-2xl shadow-card-glow backdrop-blur-2xl overflow-hidden z-50 max-h-[440px] overflow-y-auto">
                    <div id="searchResultsList" class="divide-y divide-white/5"></div>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex items-center gap-2.5">
                <button onclick="openModal('partyModal')" class="flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-zinc-900 border border-white/15 text-white text-xs font-bold hover:bg-white hover:text-black transition-all shadow-lg">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span class="hidden lg:inline">Watch Together</span>
                </button>

                <button id="authBtn" onclick="openModal('authModal')" class="px-5 py-2.5 rounded-2xl bg-white text-black text-xs font-bold shadow-glow hover:bg-zinc-200 transition-all">
                    Sign In
                </button>

                <button onclick="toggleMobileNav()" class="md:hidden p-2 text-zinc-400 hover:text-white">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div id="mobileNav" class="hidden md:hidden px-4 pb-4 border-t border-white/10 space-y-3 bg-zinc-950">
            <div class="mt-3">
                <input type="text" id="mobileSearchInput" oninput="handleSearch(this.value)" placeholder="Search movies or TV shows..." class="w-full bg-zinc-900 border border-white/15 rounded-xl px-4 py-2.5 text-xs text-white">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="switchTab('home'); toggleMobileNav();" class="px-3 py-2 text-left text-xs font-semibold text-zinc-300 hover:bg-white/10 rounded-lg">Home</button>
                <button onclick="switchTab('movies'); toggleMobileNav();" class="px-3 py-2 text-left text-xs font-semibold text-zinc-300 hover:bg-white/10 rounded-lg">Movies</button>
                <button onclick="switchTab('tv'); toggleMobileNav();" class="px-3 py-2 text-left text-xs font-semibold text-zinc-300 hover:bg-white/10 rounded-lg">TV Shows</button>
                <button onclick="switchTab('watchlist'); toggleMobileNav();" class="px-3 py-2 text-left text-xs font-semibold text-zinc-300 hover:bg-white/10 rounded-lg">Watchlist</button>
            </div>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12 flex-1">
        
        <!-- FEATURED HERO BANNER -->
        <section id="heroBanner" class="relative rounded-3xl overflow-hidden border border-white/15 bg-zinc-950 min-h-[420px] lg:min-h-[480px] flex items-end p-6 lg:p-12 shadow-card-glow group">
            <div id="heroBg" class="absolute inset-0 bg-cover bg-center scale-105 group-hover:scale-100 transition-transform duration-700 opacity-50"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-zinc-950 via-zinc-950/40 to-transparent"></div>
            
            <div class="relative z-10 max-w-2xl space-y-4">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/20 text-white text-[10px] font-black uppercase tracking-widest backdrop-blur-md">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Featured Media
                </span>
                <h1 id="heroTitle" class="text-3xl sm:text-5xl lg:text-6xl font-black text-white leading-none tracking-tight">Loading Title...</h1>
                <p id="heroOverview" class="text-zinc-300 text-xs sm:text-sm line-clamp-3 leading-relaxed max-w-xl">Fetching overview...</p>
                
                <div class="flex items-center gap-4 pt-2">
                    <button id="heroPlayBtn" class="flex items-center gap-2.5 px-8 py-3.5 rounded-2xl bg-white text-black font-extrabold text-xs shadow-glow hover:bg-zinc-200 hover:scale-105 transition-all">
                        <i data-lucide="play" class="w-4 h-4 fill-black"></i> Watch Now
                    </button>
                    <button id="heroWatchlistBtn" class="p-3.5 rounded-2xl bg-zinc-900/80 border border-white/20 text-white hover:bg-white hover:text-black transition-all backdrop-blur-md">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- TOP 10 MOVIES CAROUSEL -->
        <section id="top10Section" class="space-y-5">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-6 bg-white rounded-full"></div>
                <h2 class="text-xl font-extrabold text-white tracking-wide">Top 10 Movies Today</h2>
            </div>
            <div id="top10Grid" class="flex gap-4 overflow-x-auto no-scrollbar py-2"></div>
        </section>

        <!-- TOP 10 TV SERIES CAROUSEL -->
        <section id="top10TVSection" class="space-y-5">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-6 bg-white rounded-full"></div>
                <h2 class="text-xl font-extrabold text-white tracking-wide">Top 10 TV Series Today</h2>
            </div>
            <div id="top10TVGrid" class="flex gap-4 overflow-x-auto no-scrollbar py-2"></div>
        </section>

        <!-- MAIN MEDIA CATALOG GRID -->
        <section class="space-y-
